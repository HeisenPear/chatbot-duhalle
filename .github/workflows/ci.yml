name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests (base, banc de questions, jeu inédit, Worker, robustesse)
        run: npm test
      - name: Le widget compilé et son empreinte sont à jour
        run: |
          npm run build
          if [ -n "$(git status --porcelain public oxatis)" ]; then
            git status --porcelain public oxatis
            echo "Le widget compilé (public/v/), son empreinte ou la page de démonstration ne sont pas à jour : lancez npm run build et commitez les fichiers."
            exit 1
          fi
      - name: Le Worker se construit comme sur Cloudflare
        run: npx wrangler deploy --dry-run --outdir dist
        env:
          WRANGLER_SEND_METRICS: "false"
